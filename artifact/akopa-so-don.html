<style>

  --ok:#5fd09a; --ok-soft:#163427; --warn:#f2b54a; --warn-soft:#382b12; --bad:#ff8a80; --bad-soft:#3d1b1a;

:root[data-theme="dark"]{

<script>
/* ================= cấu hình AKOPA ================= */
const COMPANY={brand:'AKOPA UNIFORM',name:'CÔNG TY TNHH ĐỒNG PHỤC KHỞI PHÁT',city:'Quy Nhơn – Gia Lai'};
const PRODUCTS=['Áo thun cổ tròn','Áo thun cổ tim','Áo polo','Áo polo tay dài','Áo thun tay dài','Áo khoác','Nón / mũ','Tạp dề','Khác'];

function dmy(iso){if(!iso)return'';const d=new Date(iso.length===10?iso+'T00:00:00':iso);if(isNaN(d))return'';return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()}
function dt(iso){if(!iso)return'';const d=new Date(iso);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function parseDMY(v){const m=String(v||'').trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2}|\d{4})$/);if(!m)return'';let[,d,mo,y]=m;if(y.length===2)y='20'+y;const D=new Date(+y,+mo-1,+d);if(D.getDate()!=+d)return'';return D.getFullYear()+'-'+pad(D.getMonth()+1)+'-'+pad(D.getDate())}
function maskDMY(v){const g=String(v).replace(/\D/g,'').slice(0,8);return g.length>4?g.slice(0,2)+'/'+g.slice(2,4)+'/'+g.slice(4):g.length>2?g.slice(0,2)+'/'+g.slice(2):g}
/* Ô ngày: gõ tự do (20/12, 20/12/26, 201226…), tự chuẩn hóa khi rời ô; có lịch bấm chọn */
function parseFlex(v){const t=String(v||'').trim();if(!t)return'';let d,mo,y;
  const m=t.match(/^(\d{1,2})\s*[\/\-. ]\s*(\d{1,2})(?:\s*[\/\-. ]\s*(\d{2}|\d{4}))?$/);
  if(m){d=+m[1];mo=+m[2];y=m[3]}else{const g=t.replace(/\D/g,'');if(g.length===4){d=+g.slice(0,2);mo=+g.slice(2,4)}else if(g.length===6||g.length===8){d=+g.slice(0,2);mo=+g.slice(2,4);y=g.slice(4)}else return''}
  const now=new Date();now.setHours(0,0,0,0);
  if(!y){y=now.getFullYear();const c=new Date(y,mo-1,d);if(c<now&&(now-c)/864e5>60)y++}else{y=String(y);if(y.length===2)y='20'+y;y=+y}
  const D=new Date(y,mo-1,d);if(D.getDate()!==d||D.getMonth()!==mo-1||y<2020||y>2100)return'';
  return D.getFullYear()+'-'+pad(D.getMonth()+1)+'-'+pad(D.getDate())}
const WD=['Chủ nhật','Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'];
function dateHintText(iso){if(!iso)return'';const d=daysTo(iso);const w=WD[new Date(iso+'T00:00:00').getDay()];return `${w}, ${dmy(iso)} · ${d<0?`đã qua ${-d} ngày`:d===0?'hôm nay':`còn ${d} ngày`}`}

function bindDate(id,onSet){const inp=$('#'+id);if(!inp)return;const h=$('#'+id+'_h');

function openCal(inp,pick){closeCal();const box=inp.parentElement;let sel=parseFlex(inp.value);const base=sel?new Date(sel+'T00:00:00'):new Date();let y=base.getFullYear(),m=base.getMonth();
  const pop=document.createElement('div');pop.className='calpop';pop.setAttribute('role','dialog');pop.setAttribute('aria-label','Chọn ngày');box.appendChild(pop);
  const today=new Date();const tISO=today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate());
  const draw=()=>{const first=new Date(y,m,1);const off=(first.getDay()+6)%7;const n=new Date(y,m+1,0).getDate();let cells='';
    for(let i=0;i<off;i++)cells+='<span></span>';
    for(let d=1;d<=n;d++){const iso=y+'-'+pad(m+1)+'-'+pad(d);cells+=`<button type="button" data-d="${iso}" class="${iso===sel?'sel':''}${iso===tISO?' today':''}">${d}</button>`}
    pop.innerHTML=`<div class="calhd"><button type="button" data-nav="-1" aria-label="Tháng trước">‹</button><b>Tháng ${m+1}/${y}</b><button type="button" data-nav="1" aria-label="Tháng sau">›</button></div><div class="calgrid">${['T2','T3','T4','T5','T6','T7','CN'].map(x=>`<i>${x}</i>`).join('')}${cells}</div><div class="calquick">${[3,5,7,10,14].map(k=>`<button type="button" data-add="${k}">+${k} ngày</button>`).join('')}</div>`;
    pop.querySelectorAll('[data-nav]').forEach(b=>b.onclick=e=>{e.stopPropagation();m+=+b.dataset.nav;if(m<0){m=11;y--}if(m>11){m=0;y++}draw()});

    pop.querySelectorAll('[data-add]').forEach(b=>b.onclick=e=>{e.stopPropagation();const D=new Date();D.setDate(D.getDate()+(+b.dataset.add));pick(D.getFullYear()+'-'+pad(D.getMonth()+1)+'-'+pad(D.getDate()));closeCal()})};

const PERM_ACT=[['edit','Tạo / sửa đơn, gửi thiết kế, chuyển SX'],['approve','Chốt mẫu khách duyệt'],['designUpload','Nộp mẫu thiết kế'],['prodUpdate','Cập nhật bước sản xuất'],['confirmDeposit','Xác nhận đã nhận cọc (kế toán)'],['purchase','Mua hàng / đặt OEM (kế toán)'],['deliver','Giao hàng & thu tiền'],['status','Đổi trạng thái đơn'],['pdf','Tải lệnh sản xuất'],['revenue','Xem doanh thu']];

  db.collection('options').limit(1000).onSnapshot(s=>{const n={product:[],fabric:[],method:[],position:[],supplier:[]};s.docs.forEach(d=>{const x=d.data()||{};if(n[x.type]&&x.label&&!x.hidden)n[x.type].push(String(x.label))});Object.values(n).forEach(a=>a.sort((x,y)=>x.localeCompare(y,'vi')));customOpts=n},()=>{});
  db.collection('config').limit(20).onSnapshot(s=>{const d=s.docs.find(x=>x.id==='perms');permCfg=d?d.data()||{}:{};rerender()},()=>{});

    if(!rerender._homed&&myTeam()&&view==='list'){rerender._homed=true;view=TEAM_HOME[myTeam()]||'list'}rerender()},()=>{rolesLoaded=true;rerender()});

/* ================= tabs ================= */
function counts(){const a=orders.filter(isActive);
  return{work:a.length,design:orders.filter(o=>o.design&&['working','redo'].includes(o.design.state)&&isActive(o)).length,
    review:orders.filter(o=>o.design&&o.design.state==='review'&&isActive(o)).length,
    prod:orders.filter(o=>o.status==='Đang sản xuất').length,
    ready:orders.filter(o=>o.status==='Sẵn sàng giao').length,
    purch:orders.filter(o=>o.status==='Đang sản xuất'&&curKey(o)==='purchase').length,
    depWait:orders.filter(o=>isActive(o)&&!o.prod&&priceOk(o)&&!depositOk(o)).length,
    debt:orders.filter(o=>o.status==='Đã giao'&&remain(o)>0).length,
    urgent:a.filter(o=>['red','late'].includes(urg(o))).length}}
function renderTabs(){const nav=$('#tabs');if(!db){nav.hidden=true;return}nav.hidden=false;const c=counts();
  const P=perm();const pend=Object.keys(members).filter(id=>!teamOf(id)&&members[id].requestedTeam).length;
  const ALL={list:['Đơn hàng',c.urgent,c.urgent>0],design:['Thiết kế',c.design+(P.approve?c.review:0),c.design>0],production:['Sản xuất',c.prod,false],purchase:['Mua hàng',c.purch,c.purch>0],money:['Giao & thu tiền',c.ready+c.debt+(P.confirmDep?c.depWait:0),c.ready>0||(P.confirmDep&&c.depWait>0)],revenue:['Doanh thu',0,false],team:['Nhân sự',canManage?pend:0,canManage&&pend>0]};
  const T=P.tabs.map(k=>[k].concat(ALL[k]));
  const v=view==='form'?'list':view;
  nav.innerHTML=T.map(([k,l,n,hot])=>`<button class="tab${hot?' hot':''}" data-v="${k}"${v===k?' aria-current="page"':''}>${l}${n?`<span class="cnt">${n}</span>`:''}</button>`).join('');
  nav.querySelectorAll('.tab').forEach(b=>b.onclick=()=>go(b.dataset.v))}
function go(v){if(view==='form'&&mode!=='view'&&JSON.stringify(cur)!==JSON.stringify(orig)){confirmLeave(()=>{view=v;mode='view';cur=null;rerender()});return}view=v;mode='view';cur=null;rerender();window.scrollTo(0,0)}
function confirmLeave(ok){showModal(`<h2>Bỏ thay đổi chưa lưu?</h2><p>Đơn đang sửa chưa được lưu.</p><div class="acts"><button class="btn" id="cNo">Ở lại</button><button class="btn danger" id="cYes">Bỏ thay đổi</button></div>`);$('#cNo').onclick=closeModal;$('#cYes').onclick=()=>{closeModal();ok()}}
function rerender(){renderTabs();renderWho();$('#bar').hidden=view!=='form';
  const P=perm();
  if(P.pending){app.innerHTML=`<div class="empty"><h3>Chưa có quyền xem đơn</h3><p>${members[me]?'Quản lý đang duyệt bộ phận của bạn.':'Bấm “Chọn bộ phận” ở góc trên để bắt đầu.'}</p></div>`;$('#bar').hidden=true;return}
  if(view!=='form'&&!P.tabs.includes(view))view=P.tabs[0];
  if(view==='list')renderList();else if(view==='design')renderDesign();else if(view==='production')renderProd();else if(view==='money')renderMoney();else if(view==='revenue')renderRevenue();else if(view==='team')renderTeam();else if(view==='purchase')renderPurchase();else if(view==='form'){if(mode==='view')renderForm()}}

   <div class="filters"><input type="search" id="q" placeholder="Tìm mã đơn, tên khách, sản phẩm…" value="${esc(q)}">${P.edit?'<button class="btn primary" id="newBtn">+ Đơn mới</button>':''}</div>

/* ================= ảnh / file ================= */
const ZONE_LABEL={logoImages:'Thêm logo',refImages:'Thêm ảnh mẫu',listFiles:'Ảnh danh sách'};
const ZONE_NAME={logoImages:'Logo khách',refImages:'Ảnh mẫu tham khảo',listFiles:'Ảnh danh sách'};
let activeZone='logoImages';
const PASTE_PH='Bấm vào đây rồi dán ảnh (Ctrl+V)\nhoặc kéo thả ảnh vào';
function pasteBoxHTML(key){return `<textarea class="pastebox" data-zone="${key}" placeholder="${PASTE_PH}" aria-label="Dán ảnh vào ${esc(ZONE_NAME[key]||'ô này')}"></textarea>`}
function bindPasteBox(box,onFiles){const pb=box.querySelector('.pastebox');if(!pb)return;
  pb.oninput=()=>{pb.value=''};
  pb.onpaste=async e=>{const fs=clipImages(e);e.preventDefault();pb.value='';if(!fs.length){toast('Không thấy ảnh trong bộ nhớ tạm. Hãy bấm “Sao chép ảnh” ở Zalo/Messenger rồi dán lại.',5000);return}e.stopPropagation();await onFiles(fs)};
  box.ondragover=e=>{e.preventDefault();box.classList.add('drop')};box.ondragleave=()=>box.classList.remove('drop');
  box.ondrop=async e=>{e.preventDefault();box.classList.remove('drop');const fs=[...(e.dataTransfer?.files||[])];if(fs.length)await onFiles(fs)}}
function clipImages(e){const it=[...(e.clipboardData&&e.clipboardData.items||[])];return it.filter(i=>i.kind==='file'&&/^image\//.test(i.type)).map(i=>i.getAsFile()).filter(Boolean).map((f,i)=>f.name&&f.name!=='image.png'?f:new File([f],'dan-anh-'+Date.now()+'-'+i+'.'+((f.type.split('/')[1]||'png').replace('jpeg','jpg')),{type:f.type}))}
function renderZone(key,boxSel){const box=boxSel?$(boxSel):$('#z_'+key);if(!box)return;const arr=cur[key];const ed=editing();
  box.dataset.zone=key;box.classList.toggle('active',ed&&activeZone===key);
  box.innerHTML=arr.map((a,i)=>`<div class="thumb">${isImg(a)?`<img src="${esc(imgSrc(a))}" alt="${esc(a.name||'ảnh')}" data-zoom>`:`<a class="fn" href="${esc(imgSrc(a))}" target="_blank" rel="noopener">${esc(a.name||'file')}</a>`}${ed?`<button type="button" class="x" data-i="${i}" aria-label="Xóa ảnh">×</button>`:''}</div>`).join('')+
   (ed?`<label class="addimg"><b>+</b>${key==='logoImages'?'Tải file gốc':ZONE_LABEL[key]}<input type="file" multiple accept="image/*,.pdf,.svg"></label>${pasteBoxHTML(key)}`:(arr.length?'':'<span class="hint">Chưa có</span>'));
  box.querySelectorAll('img[data-zoom]').forEach(im=>im.onclick=()=>zoom(im.src));
  if(!ed)return;
  box.onpointerdown=()=>{if(activeZone!==key){activeZone=key;$$('.thumbs[data-zone]').forEach(z=>z.classList.toggle('active',z.dataset.zone===key))}};
  box.querySelectorAll('.x').forEach(b=>b.onclick=()=>{arr.splice(+b.dataset.i,1);renderZone(key,boxSel)});
  const fi=box.querySelector('input[type=file]');if(fi)fi.onchange=async()=>{await uploadInto(arr,[...fi.files]);renderZone(key,boxSel)};
  bindPasteBox(box,async fs=>{activeZone=key;await uploadInto(arr,fs);renderZone(key,boxSel);toast(`Đã dán ${fs.length} ảnh vào “${ZONE_NAME[key]}”`)});
}
async function uploadInto(arr,files){if(!assets){toast('Bạn chưa có quyền tải file lên. Nhờ anh Phát cấp quyền.');return}
  for(const f of files){toast('Đang tải '+f.name+'…',60000);try{const blob=isImg({type:f.type})?await shrink(f):f;const r=await assets.upload(blob);arr.push({id:r.id,url:r.url,name:f.name,type:blob.type||f.type})}catch(e){toast('Tải lên chưa được: '+(e.message||e.code),5000);return}}
  toast('Đã tải lên '+files.length+' file')}
async function shrink(f,max=2000){if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size<700000)return f;try{const bm=await createImageBitmap(f);const s=Math.min(1,max/Math.max(bm.width,bm.height));const c=document.createElement('canvas');c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(b=>r(b||f),'image/jpeg',.86))}catch(e){return f}}
function zoom(src){showModal(`<img src="${esc(src)}" alt="Ảnh phóng to" style="max-width:100%;border-radius:8px"><div class="acts"><button class="btn" id="zX">Đóng</button></div>`);$('#zX').onclick=closeModal}
/* Ctrl+V ở bất kỳ đâu trên form: ảnh vào ô đang chọn (viền xanh), mặc định là Logo khách */

document.addEventListener('paste',async e=>{
  const fs=clipImages(e);if(!fs.length)return;

/* ================= AI đọc danh sách ================= */
let aiBusy=false;
async function runAI(){if(aiBusy)return;if(!sample){toast('Tính năng AI chưa dùng được ở chế độ xem này. Hãy nhập tay.');return}
  const text=($('#pasteList').value||'').trim();const imgs=cur.listFiles.filter(isImg);
  if(!text&&!imgs.length){toast('Dán chữ hoặc tải ảnh danh sách trước.');return}
  aiBusy=true;const note=$('#aiNote');$('#aiBtn').disabled=true;note.innerHTML='<span class="spin"></span> AI đang đọc… (10–60 giây)';
  try{let blobs=[];let lim=null;try{lim=await sample.limits()}catch(e){}
    const maxN=lim&&lim.images?(lim.images.maxCount||4):0;
    if(imgs.length&&maxN){for(const a of imgs.slice(0,maxN)){try{const r=await fetch(imgSrc(a));if(r.ok)blobs.push(await r.blob())}catch(e){}}}
    if(imgs.length&&!blobs.length&&!text)throw{message:'Không gửi được ảnh cho AI ở chế độ xem này'};
    const itemsTxt=cur.items.map((x,j)=>`Mẫu ${j+1}: ${x.product} ${x.color||''}`).join('; ');
    const prompt=`Bạn là nhân viên xưởng đồng phục AKOPA (áo thun, áo polo) ở Việt Nam. Đọc danh sách in áo khách gửi${blobs.length?' trong ảnh đính kèm':''}${text?' và phần chữ dưới đây':''}.
Mỗi người là 1 dòng với các trường: name (tên in trên áo, giữ nguyên dấu và hoa/thường như nguồn; rỗng nếu không có), number (số áo nếu có, dạng chuỗi), size (chuẩn hóa về một trong XS,S,M,L,XL,2XL,3XL,4XL; nếu nguồn ghi XXL thì là 2XL, XXXL là 3XL; nếu là size khác thì giữ nguyên), item (số thứ tự mẫu áo 1,2… nếu nguồn ghi rõ, mặc định 1), note (ghi chú như form nữ, tay dài… nếu có).
Các mẫu áo của đơn: ${itemsTxt}.
Nếu danh sách chỉ ghi số lượng theo size (VD "M: 10, L: 5") thì tạo đúng số dòng tương ứng, name rỗng.
Chỉ trả về JSON dạng {"rows":[{"name":"","number":"","size":"","item":1,"note":""}]} — không giải thích.
${text?'\n[Chữ khách gửi]\n'+text.slice(0,12000):''}`;
    const res=await sample.json(prompt,blobs.length?{images:blobs,modelTier:'default'}:{modelTier:'default'});
    const rows=(res&&Array.isArray(res.rows)?res.rows:[]).map(r=>({name:String(r.name||'').trim(),number:String(r.number??'').trim(),size:String(r.size||'').trim().toUpperCase(),item:(cur.items[(Number(r.item)||1)-1]||cur.items[0]).id,note:String(r.note||'').trim()}));
    if(!rows.length){note.textContent='AI không thấy dòng nào. Kiểm tra lại ảnh/chữ.';return}
    cur.names=cur.names.filter(r=>r.name||r.number||r.size).concat(rows);renderNames();
    note.textContent=`AI đã thêm ${rows.length} dòng — kiểm tra lại trước khi lưu.`;
  }catch(e){note.textContent=e.code==='not_granted'?'Bạn chưa cho phép dùng AI trên trang này.':'AI chưa đọc được: '+(e.message||e.code)}
  finally{aiBusy=false;const b=$('#aiBtn');if(b)b.disabled=false}
}

function validate(o){const m=[];const di=$('#oDate');if(di&&di.value.trim()&&!o.deliveryDate){const iso=parseFlex(di.value);if(iso)o.deliveryDate=iso}if(!o.customer.name.trim())m.push('tên khách');if(!o.customer.phone.trim())m.push('số điện thoại');if(!o.deliveryDate)m.push('ngày hẹn giao (dd/mm/yyyy)');if(!qtyOf(o))m.push('số lượng áo');
  if(m.length){toast('Còn thiếu: '+m.join(', '),4500);return false}return true}
function payload(o){const p=clone(o);delete p.code;p.names=p.names.filter(r=>r.name||r.number||r.size||r.note);p.qty=qtyOf(o);p.total=total(o);p.searchName=(o.customer.name||'').toLowerCase();return p}
async function nextCode(){const d=new Date();const prefix='AK'+String(d.getFullYear()).slice(2)+pad(d.getMonth()+1);
  let seq=orders.filter(o=>o.prefix===prefix).reduce((m,o)=>Math.max(m,num(o.seq)),0);
  for(let t=0;t<20;t++){seq++;const code=prefix+'-'+String(seq).padStart(3,'0');const s=await db.doc('orders/'+code).get();if(!s.exists)return{code,prefix,seq}}
  throw{message:'Không cấp được mã đơn'}}
const nowISO=()=>new Date().toISOString();
const hist=(text)=>({at:nowISO(),by:me||'',text});
async function saveNew(){if(saving||!validate(cur))return;saving=true;renderBar();
  try{const{code,prefix,seq}=await nextCode();const now=nowISO();const p=payload(cur);
    Object.assign(p,{prefix,seq,createdAt:now,updatedAt:now,createdBy:me||'',updatedBy:me||'',history:[hist(`Tạo đơn (${fmt(qtyOf(cur))} áo, ${vnd(total(cur))})`)]});
    await db.doc('orders/'+code).set(p);saving=false;toast('Đã lưu đơn '+code);openForm(Object.assign(normalize(p),{code}),'view');
  }catch(e){saving=false;renderBar();toast(e.code==='permission_denied'||e.code==='invalid_argument'?'Bạn chưa có quyền lưu đơn. Nhờ anh Phát cấp quyền Contributor.':'Lưu chưa được: '+(e.message||e.code),5000)}}
function diffText(a,b){const ch=[];if(a.customer.name!==b.customer.name)ch.push('tên khách');if(a.customer.phone!==b.customer.phone)ch.push('SĐT');if(a.deliveryDate!==b.deliveryDate)ch.push(`ngày giao ${dmy(a.deliveryDate)}→${dmy(b.deliveryDate)}`);
  if(qtyOf(a)!==qtyOf(b))ch.push(`SL ${qtyOf(a)}→${qtyOf(b)}`);if(total(a)!==total(b))ch.push(`tổng tiền ${vnd(total(a))}→${vnd(total(b))}`);
  if(JSON.stringify(a.items)!==JSON.stringify(b.items)&&qtyOf(a)===qtyOf(b))ch.push('sản phẩm/size');if(JSON.stringify(a.deco)!==JSON.stringify(b.deco))ch.push('in/thêu');if(JSON.stringify(a.names)!==JSON.stringify(b.names))ch.push('danh sách tên');if(a.prodNote!==b.prodNote)ch.push('ghi chú xưởng');
  return ch.length?'Sửa: '+ch.join(', '):'Sửa đơn'}
async function saveEdit(){if(saving||!validate(cur))return;saving=true;renderBar();

const apvSet=d=>{if(!d)return[];if(Array.isArray(d.approvedVs))return d.approvedVs.slice();if(d.approvedV)return[d.approvedV];if(d.state==='approved'&&d.versions&&d.versions.length)return[d.versions[d.versions.length-1].v];return[]};

function openApprove(o,preV){const d=o.design;const vs=d.versions||[];const set=new Set(apvSet(d));set.add(preV||vs.length);const pf=d.approvedFor||{};const multi=o.items.length>1;
  showModal(`<h2>Khách chốt mẫu nào?</h2><p class="hint">Tích <b>tất cả</b> các mẫu khách chốt — đơn có nhiều mẫu áo thì chốt nhiều bản. Các mẫu được tích sẽ in vào lệnh sản xuất.</p>
  <div class="vpick">${vs.slice().reverse().map(v=>`<div class="vopt"><label class="vchk"><input type="checkbox" name="apv" value="${v.v}"${set.has(v.v)?' checked':''}><b>V${v.v}</b></label><span class="vthumbs">${v.images.slice(0,3).map(a=>`<img src="${esc(imgSrc(a))}" alt="Mẫu V${v.v}">`).join('')}</span><small class="hint">${dt(v.at)}${v.feedback?' · có góp ý sửa':''}</small>${multi?`<select class="vfor" data-v="${v.v}" aria-label="Mẫu V${v.v} dùng cho"><option value="">Dùng cho: tất cả</option>${o.items.map((it,i)=>`<option value="${it.id}"${pf[v.v]===it.id?' selected':''}>Dùng cho mẫu áo ${i+1}: ${esc(it.product)}${it.color?' '+esc(it.color):''}</option>`).join('')}</select>`:''}</div>`).join('')}</div>
  <div class="acts"><button class="btn" id="mX">Đóng</button><button class="btn primary" id="mOk">Lưu mẫu khách chốt</button></div>`);
  $('#mX').onclick=closeModal;$('#mOk').onclick=()=>{const vsel=[...document.querySelectorAll('input[name=apv]:checked')].map(x=>+x.value).sort((a,b)=>a-b);if(!vsel.length){toast('Tích ít nhất 1 mẫu khách chốt.');return}
    const af={};document.querySelectorAll('.vfor').forEach(x=>{if(x.value&&vsel.includes(+x.dataset.v))af[x.dataset.v]=x.value});
    const was=apvSet(d);const nd=Object.assign({},d,{state:'approved',approvedVs:vsel,approvedFor:af,approvedAt:nowISO()});delete nd.approvedV;
    const upd=withPre(o,{design:nd});
    const lbl=vsel.map(v=>'V'+v).join(' + ');act(()=>patch(o,upd,was.length&&d.state==='approved'?`Cập nhật mẫu chốt: ${was.map(v=>'V'+v).join(' + ')} → ${lbl}`:`Khách chốt mẫu ${lbl}`),`Đã chốt ${lbl}`)}}
async function unApprove(o,v){const d=o.design;const set=apvSet(d).filter(x=>x!==v);const nd=Object.assign({},d,{approvedVs:set});delete nd.approvedV;if(nd.approvedFor){nd.approvedFor=Object.assign({},nd.approvedFor);delete nd.approvedFor[v]}
  if(!set.length&&nd.state==='approved')nd.state='review';await act(()=>patch(o,{design:nd},`Bỏ chốt mẫu V${v}`),`Đã bỏ chốt V${v}`)}
function openRedo(o){showModal(`<h2>Khách muốn sửa gì?</h2><textarea id="rTxt" placeholder="VD: logo to hơn, đổi chữ sang màu vàng"></textarea><div class="acts"><button class="btn" id="mX">Đóng</button><button class="btn primary" id="mOk">Gửi lại thiết kế</button></div>`);
  $('#mX').onclick=closeModal;$('#mOk').onclick=()=>{const t=$('#rTxt').value.trim();if(!t){toast('Ghi rõ nội dung cần sửa.');return}const d=clone(o.design);d.state='redo';const L=d.versions[d.versions.length-1];if(L)L.feedback=t;act(()=>patch(o,{design:d},'Khách yêu cầu sửa: '+t),'Đã gửi lại thiết kế')}}
function renderDesign(){const act_=orders.filter(o=>isActive(o)&&o.design);
  const todo=act_.filter(o=>['working','redo'].includes(o.design.state)).sort((a,b)=>(a.deliveryDate||'9')<(b.deliveryDate||'9')?-1:1);
  const rev=act_.filter(o=>o.design.state==='review');
  const block=(o,btns)=>`<div class="qcard">${cardHTML(o,`<div class="hint" style="margin-top:4px">${esc(dLabel(o.design))}${o.design.assignee?' · '+esc(nameOf(o.design.assignee)):''}${o.design.request?' · '+esc(o.design.request):''}${o.design.state==='redo'?' · <b style="color:var(--bad)">'+esc((o.design.versions.slice(-1)[0]||{}).feedback||'')+'</b>':''}</div>`)}<div class="qact">${btns}</div></div>`;
  app.innerHTML=`<h2 style="font-size:20px;margin-bottom:10px">Cần thiết kế (${todo.length})</h2><div class="list">${todo.length?todo.map(o=>block(o,perm(o).design?`<button class="btn sm primary" data-up="${esc(o.code)}">Nộp mẫu V${(o.design.versions||[]).length+1}</button>`:'<span class="hint">Chờ bộ phận thiết kế</span>')).join(''):'<div class="empty"><h3>Không còn mẫu cần làm</h3><p>Đơn sale gửi thiết kế sẽ hiện ở đây.</p></div>'}</div>
   <h2 style="font-size:20px;margin:18px 0 10px">Chờ khách duyệt (${rev.length})</h2><div class="list">${rev.length?rev.map(o=>block(o,perm().approve?`<button class="btn sm primary" data-ok="${esc(o.code)}">Khách chốt</button><button class="btn sm" data-redo="${esc(o.code)}">Khách yêu cầu sửa</button>`:'<span class="hint">Sale đang gửi khách duyệt</span>')).join(''):'<div class="empty">Không có mẫu đang chờ khách.</div>'}</div>`;
  bindCards(app);const F=c=>orders.find(x=>x.code===c);
  app.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>openUpload(F(b.dataset.up)));
  app.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>openApprove(F(b.dataset.ok)));
  app.querySelectorAll('[data-redo]').forEach(b=>b.onclick=()=>openRedo(F(b.dataset.redo)));
}

/* ================= sản xuất ================= */
function openToProd(o){const warns=[];if(!designOk(o))warns.push(o.design?'Mẫu thiết kế <b>chưa được khách chốt</b>.':'Đơn <b>chưa có mẫu thiết kế</b>.');if(!priceOk(o))warns.push('Khách <b>chưa chốt giá</b>.');
  const needWaive=!depositOk(o);
  if(needWaive&&!isBoss()){showModal(`<h2>Chưa chuyển sản xuất được</h2><div class="banner" style="margin:0">Kế toán <b>chưa xác nhận đã nhận cọc</b> cho đơn ${esc(o.code)}.${warns.length?'<br>'+warns.join('<br>'):''}</div><p class="hint">Nhắc kế toán vào tab “Giao &amp; thu tiền” → “Chờ xác nhận cọc”. Trường hợp đặc biệt (khách quen, sản xuất trước) cần Quản lý duyệt.</p><div class="acts"><button class="btn" id="mX">Đã hiểu</button></div>`);$('#mX').onclick=closeModal;return}
  if(needWaive)warns.push('Kế toán <b>chưa xác nhận nhận cọc</b>.');
  showModal(`<h2>Chuyển đơn ${esc(o.code)} sang sản xuất</h2>${warns.length?`<div class="banner" style="margin:0">${warns.join('<br>')}</div>`:''}
  <div class="f"><span class="flabel">Nguồn hàng từng mẫu áo</span>${o.items.map((it,i)=>`<label class="f"><span style="text-transform:none;letter-spacing:0">Mẫu ${i+1}: ${esc(it.product)}${it.color?' '+esc(it.color):''} · ${fmt(itemQty(it))} áo</span><select data-sup="${it.id}">${Object.entries(SUPPLY).map(([k,v])=>`<option value="${k}"${(it.supply||'')===k?' selected':''}>${v}</option>`).join('')}</select></label>`).join('')}
  <p class="hint" style="margin:0">Mua áo có sẵn / Đặt may OEM → kế toán nhận việc ở tab <b>Mua hàng</b> trước khi xưởng in.</p></div>
  <div class="f"><span class="flabel">Hẹn xưởng xong</span>${dateBoxHTML('pDue','','Nên trước ngày giao khách 1–2 ngày')}</div>
  ${needWaive?`<label class="check"><input type="checkbox" id="pWaive"> <span>Quản lý duyệt sản xuất khi <b>chưa nhận cọc</b></span></label><label class="f"><span>Lý do</span><input id="pWhy" placeholder="VD: khách quen, cọc sau khi nhận mẫu"></label>`:''}
  <div class="acts"><button class="btn" id="mX">Đóng</button><button class="btn primary" id="mOk">Chuyển sản xuất</button></div>`);
  let pDueISO='';bindDate('pDue',iso=>pDueISO=iso);
  $('#mX').onclick=closeModal;$('#mOk').onclick=()=>{const sup={};document.querySelectorAll('[data-sup]').forEach(x=>sup[x.dataset.sup]=x.value);const items=o.items.map(it=>Object.assign({},it,{supply:sup[it.id]||it.supply||'self'}));const tmpO=Object.assign({},o,{items});const keys=buildStages(tmpO);const pm=poModes(tmpO);let extra={},why='';
    if(needWaive){if(!$('#pWaive').checked){toast('Tích ô “Quản lý duyệt sản xuất khi chưa nhận cọc” để tiếp tục.',4500);return}why=$('#pWhy').value.trim();if(!why){toast('Ghi lý do sản xuất khi chưa nhận cọc.');return}extra={depositWaive:{at:nowISO(),by:me||'',reason:why}}}
    const pur=Object.assign({},o.purchase||{});pm.forEach(m=>{if(!pur[m])pur[m]={status:'todo'}});
    act(()=>patch(o,Object.assign({items,prod:{stageKeys:keys,stage:0,due:pDueISO||parseFlex($('#pDue').value),startedAt:nowISO(),stageAt:{}},purchase:pur,status:'Đang sản xuất'},extra),'Chuyển sản xuất · '+[...new Set(items.map(i=>SUPPLY[i.supply]))].join(' + ')+(pm.length?' → kế toán '+pm.map(m=>PO_KIND[m].short).join(' & '):'')+(why?' · chưa cọc, QL duyệt: '+why:'')),'Đã chuyển sản xuất')}}
async function stageDone(o){const P=clone(o.prod);P.stageAt=P.stageAt||{};P.stageAt[P.stage]={at:nowISO(),by:me||''};const name=SG(o)[P.stage];P.stage++;
  const upd={prod:P};if(P.stage>=SG(o).length){upd.status='Sẵn sàng giao';P.doneAt=nowISO()}
  await act(()=>patch(o,upd,'Xong: '+name+(upd.status?' → Sẵn sàng giao':'')),'Đã cập nhật')}
function renderProd(){const L=orders.filter(o=>o.status==='Đang sản xuất'&&o.prod).map(o=>{if(o.prod.stage>=SG(o).length){o=clone(o);o.prod.stage=SG(o).length-1}return o}).sort((a,b)=>((a.prod.due||a.deliveryDate||'9')<(b.prod.due||b.deliveryDate||'9'))?-1:1);
  const wait=orders.filter(o=>isActive(o)&&!o.prod&&o.status==='Đã cọc');
  app.innerHTML=`<h2 style="font-size:20px;margin-bottom:10px">Đang sản xuất (${L.length})</h2><div class="list">${L.length?L.map(o=>{const P=o.prod;const late=P.due&&daysTo(P.due)<0;
    return `<div class="qcard">${cardHTML(o,`<div class="stepper">${SG(o).map((n,i)=>`<span class="step ${i<P.stage?'done':i===P.stage?'now':''}">${n}</span>`).join('')}</div><div class="hint">${supplyLabel(o)}${curKey(o)==='purchase'?' · <b style="color:var(--warn)">'+poModes(o).map(m=>PO_KIND[m].short+': '+PST[purchState(o,m)]).join(', ')+'</b>':''}${P.due?` · hẹn xong <span class="${late?'due-bad':''}">${dmy(P.due)}</span>`:''}</div>`)}
    <div class="qact">${curKey(o)==='purchase'?(perm(o).purchase?`<button class="btn sm primary" data-pur="${esc(o.code)}">Mua hàng / đặt OEM</button>`:'<span class="hint">Chờ kế toán mua hàng / đặt OEM</span>'):perm(o).prod?`<button class="btn sm primary" data-st="${esc(o.code)}">✓ Xong “${esc(SG(o)[P.stage])}”</button>`:''}${perm(o).pdf?`<button class="btn sm" data-pdf="${esc(o.code)}">Lệnh SX (PDF)</button>`:''}</div></div>`}).join(''):'<div class="empty"><h3>Xưởng đang trống</h3><p>Đơn sale chuyển sản xuất sẽ hiện ở đây.</p></div>'}</div>
   ${wait.length?`<h2 style="font-size:20px;margin:18px 0 10px">Đã cọc, chờ chuyển sản xuất (${wait.length})</h2><div class="list">${wait.map(o=>cardHTML(o)).join('')}</div>`:''}`;
  bindCards(app);app.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>stageDone(orders.find(x=>x.code===b.dataset.st)));app.querySelectorAll('[data-pur]').forEach(b=>b.onclick=()=>openPurchase(orders.find(x=>x.code===b.dataset.pur)));
  app.querySelectorAll('[data-pdf]').forEach(b=>b.onclick=()=>exportPdf(orders.find(x=>x.code===b.dataset.pdf)));
}

/* ================= giao hàng & thu tiền ================= */
function openDeliver(o){showModal(`<h2>Giao đơn ${esc(o.code)}</h2>
  <label class="f"><span>Cách giao</span><select id="gM">${opts(SHIPS,o.shipMethod||SHIPS[0])}</select></label>
  <label class="f"><span>Mã vận đơn / nhà xe / người nhận</span><input id="gT"></label>
  <p>Tổng ${vnd(total(o))} · đã thu ${vnd(paid(o))} · <b style="color:var(--bad)">còn ${vnd(remain(o))}</b></p>
  <label class="f"><span>Thu khi giao (đ)</span><input type="number" id="gPay" min="0" value="${Math.max(0,remain(o))}"></label>
  <label class="f"><span>Hình thức</span><select id="gPm"><option>Chuyển khoản</option><option>Tiền mặt</option><option>COD</option><option>Chưa thu (công nợ)</option></select></label>
  <div class="acts"><button class="btn" id="mX">Đóng</button><button class="btn primary" id="mOk">Xác nhận đã giao</button></div>`);
  $('#mX').onclick=closeModal;$('#mOk').onclick=()=>{const pm=$('#gPm').value;const amt=pm.startsWith('Chưa')?0:num($('#gPay').value);
    const pays=o.payments.concat(amt?[{at:nowISO(),by:me||'',amount:amt,method:pm,note:'Thu khi giao'}]:[]);const rem=total(o)-depPaid(o)-pays.reduce((s,p)=>s+num(p.amount),0);
    const st=rem<=0?'Hoàn tất':'Đã giao';act(()=>patch(o,{delivery:{method:$('#gM').value,tracking:$('#gT').value.trim(),at:nowISO(),by:me||''},payments:pays,status:st,...(st==='Hoàn tất'?{completedAt:nowISO()}:{})},`Đã giao (${$('#gM').value})${amt?', thu '+vnd(amt):''}${rem>0?', còn nợ '+vnd(rem):''}`),st==='Hoàn tất'?'Đơn đã hoàn tất':'Đã giao, còn công nợ')}}
function openPay(o){showModal(`<h2>Thu tiền đơn ${esc(o.code)}</h2><p>Còn phải thu <b style="color:var(--bad)">${vnd(remain(o))}</b></p>
  <label class="f"><span>Số tiền (đ)</span><input type="number" id="yA" min="0" value="${Math.max(0,remain(o))}"></label>
  <label class="f"><span>Hình thức</span><select id="yM"><option>Chuyển khoản</option><option>Tiền mặt</option><option>COD</option></select></label>
  <label class="f"><span>Ghi chú</span><input id="yN" placeholder="VD: khách CK đợt 2"></label>
  <div class="acts"><button class="btn" id="mX">Đóng</button><button class="btn primary" id="mOk">Ghi nhận</button></div>`);
  $('#mX').onclick=closeModal;$('#mOk').onclick=()=>{const a=num($('#yA').value);if(a<=0){toast('Nhập số tiền.');return}const pays=o.payments.concat([{at:nowISO(),by:me||'',amount:a,method:$('#yM').value,note:$('#yN').value.trim()}]);
    const rem=total(o)-depPaid(o)-pays.reduce((s,p)=>s+num(p.amount),0);const upd={payments:pays};if(rem<=0&&o.status==='Đã giao'){upd.status='Hoàn tất';upd.completedAt=nowISO()}
    act(()=>patch(o,upd,`Thu ${vnd(a)} (${$('#yM').value})${rem>0?', còn '+vnd(rem):', đã đủ'}`),'Đã ghi nhận thu tiền')}}
function renderMoney(){if(!(perm().pay||perm().deliver||perm().confirmDep)){app.innerHTML='<div class="empty"><h3>Mục này dành cho Sale, Kế toán, Quản lý</h3></div>';return}const ready=orders.filter(o=>o.status==='Sẵn sàng giao').sort((a,b)=>(a.deliveryDate||'9')<(b.deliveryDate||'9')?-1:1);
  const debt=orders.filter(o=>o.status==='Đã giao'&&remain(o)>0).sort((a,b)=>((a.delivery&&a.delivery.at)||'')<((b.delivery&&b.delivery.at)||'')?-1:1);
  const sum=debt.reduce((s,o)=>s+remain(o),0);const PMm=perm();
  const dep=orders.filter(o=>isActive(o)&&!o.prod&&priceOk(o)&&!depositOk(o)).sort((a,b)=>((b.depositClaim?1:0)-(a.depositClaim?1:0))||(((a.quote&&a.quote.at)||'')<((b.quote&&b.quote.at)||'')?-1:1));
  app.innerHTML=`${PMm.confirmDep||PMm.pay?`<h2 style="font-size:20px;margin-bottom:10px">Chờ xác nhận cọc (${dep.length})</h2><div class="list" style="margin-bottom:18px">${dep.length?dep.map(o=>`<div class="qcard">${cardHTML(o,`<div class="hint">Khách chốt giá ${dt(o.quote.at)}${num(o.deposit)&&PMm.pay?' · cọc yêu cầu <b>'+vnd(o.deposit)+'</b>':''} · ${o.depositClaim?`<b style="color:var(--ok)">Đã có bill${PMm.pay?' '+vnd(o.depositClaim.amount):''} → ${esc(o.depositClaim.account||'')}</b>`:'<span style="color:var(--warn)">chưa có bill</span>'}</div>`)}${PMm.confirmDep?`<div class="qact"><button class="btn sm primary" data-dep="${esc(o.code)}">Xác nhận đã nhận cọc</button></div>`:''}</div>`).join(''):'<div class="empty">Không có đơn chờ cọc.</div>'}</div>`:''}
  <h2 style="font-size:20px;margin-bottom:10px">Sẵn sàng giao (${ready.length})</h2><div class="list">${ready.length?ready.map(o=>`<div class="qcard">${cardHTML(o)}<div class="qact"><button class="btn sm primary" data-dv="${esc(o.code)}">Giao hàng</button></div></div>`).join(''):'<div class="empty">Chưa có đơn nào chờ giao.</div>'}</div>
   <h2 style="font-size:20px;margin:18px 0 10px">Đã giao, còn công nợ (${debt.length}) · ${vnd(sum)}</h2><div class="list">${debt.length?debt.map(o=>{const ds=o.delivery&&o.delivery.at?Math.round((Date.now()-new Date(o.delivery.at))/864e5):null;
     return `<div class="qcard">${cardHTML(o,ds!==null?`<div class="hint ${ds>7?'due-bad':''}">Giao ${ds} ngày trước</div>`:'')}<div class="qact"><button class="btn sm primary" data-py="${esc(o.code)}">Thu tiền</button></div></div>`}).join(''):'<div class="empty">Không còn công nợ.</div>'}</div>`;
  bindCards(app);const F=c=>orders.find(x=>x.code===c);
  app.querySelectorAll('[data-dep]').forEach(b=>b.onclick=()=>openDeposit(F(b.dataset.dep)));app.querySelectorAll('[data-dv]').forEach(b=>b.onclick=()=>openDeliver(F(b.dataset.dv)));app.querySelectorAll('[data-py]').forEach(b=>b.onclick=()=>openPay(F(b.dataset.py)));
}

/* ================= trạng thái tay ================= */
/* Đổi trạng thái có đồng bộ quy trình: lùi về thiết kế / tiến tới sản xuất đều làm được */
const SX_BEFORE=['Mới','Chờ duyệt mẫu','Đã duyệt mẫu','Chờ cọc','Đã cọc'];
function openStatus(o,preset,quick){const d=o.design;const vs=(d&&d.versions)||[];const P=o.prod;
  showModal(`<h2>${quick?'Khách đặt thêm / sửa mẫu · ':'Đổi trạng thái '}${esc(o.code)}</h2>
  <p class="hint">Hiện tại: <b>${esc(o.status)}</b>${P?` · sản xuất đang ở bước “${esc(SG(o)[Math.min(P.stage,SG(o).length-1)])}”${P.stage>=SG(o).length?' (đã xong)':''}`:''}${d?` · thiết kế: ${esc(dLabel(d))}`:''}</p>
  <label class="f"${quick?' hidden':''}><span>Chuyển sang trạng thái</span><select id="sS">${opts(STATUSES,preset||o.status)}</select></label>
  <div id="stOpts" style="display:flex;flex-direction:column;gap:10px"></div>
  <label class="f"><span>Lý do / ghi chú</span><input id="sR" placeholder="${quick?'VD: khách thêm mẫu áo polo trắng 20 cái':'VD: thao tác nhầm, khách tạm hoãn…'}"></label>
  <div class="acts"><button class="btn" id="mX">Đóng</button><button class="btn primary" id="mOk">${quick?'Gửi lại thiết kế':'Lưu trạng thái'}</button></div>`);
  const box=$('#stOpts');
  const draw=()=>{const t=$('#sS').value;let h='';
    if(SX_BEFORE.includes(t)&&P)h+=`<div class="banner" style="margin:0">Tiến độ sản xuất hiện tại sẽ được <b>xóa khỏi tab Sản xuất</b> (vẫn lưu trong lịch sử). Khi xong thiết kế, bấm “Chuyển sản xuất” lại.</div>`;
    if(t==='Mới'||t==='Chờ duyệt mẫu'){
      h+=`<label class="check"><input type="checkbox" id="stRe"${t==='Chờ duyệt mẫu'?' checked':''}> <span>Gửi bộ phận thiết kế làm tiếp${vs.length?` (mẫu mới sẽ là V${vs.length+1}, các bản cũ vẫn giữ)`:''}</span></label>

        ...(mock.length?[H('3. Mẫu thiết kế '+(okList.length?'đã chốt':'(CHƯA CHỐT)')),...mockGroups.flatMap(g=>[{text:`V${g.v.v}${(d.approvedFor||{})[g.v.v]?' – '+itemLabel(o,d.approvedFor[g.v.v]):''}`,bold:true,fontSize:10,margin:[0,4,0,3]},{columns:g.imgs.map(u=>({image:u,fit:[g.imgs.length>1?250:520,g.imgs.length>1?250:300]})),columnGap:10,margin:[0,0,0,6]}])]:[]),
        ...(logos.length||o.logoLink?[H('Logo khách'),...(logos.length?[{columns:logos.map(u=>({image:u,fit:[120,90]})),columnGap:10}]:[]),...(o.logoLink?[{text:'File gốc: '+o.logoLink,fontSize:9,color:'#1f62a8',margin:[0,4,0,0]}]:[])]:[]),
        ...(names.length?[H(`${mock.length?'4':'3'}. Danh sách in tên / số (${names.length} người)`),{table:{headerRows:1,widths:[24,'*',40,44,40,'*'],body:[['#','Tên in','Số','Size','Mẫu','Ghi chú'].map(t=>cell(t,{bold:true,fillColor:LAB}))].concat(names.map((r,i)=>[cell(i+1),cell(r.name,{bold:true}),cell(r.number,{alignment:'center'}),cell(r.size,{alignment:'center'}),cell('M'+(Math.max(0,o.items.findIndex(x=>x.id===r.item))+1)),cell(r.note)]))},layout:lay}]:[]),
        H('Ghi chú cho xưởng'),{text:o.prodNote||'—',fontSize:10},
        {margin:[0,24,0,0],columns:['Sale','Thiết kế','Sản xuất','Kiểm hàng (QC)'].map(t=>({stack:[{text:t,bold:true,alignment:'center'},{text:'(ký, ghi rõ họ tên)',fontSize:8,color:'#777',alignment:'center',margin:[0,0,0,40]}]}))}
      ]};
    const blob=await new Promise((res,rej)=>{try{pdfMake.createPdf(dd).getBlob(res)}catch(e){rej(e)}});
    toast('Đã tạo xong, chọn lưu file…');
    await downloads.save({filename:`Lenh-SX-${o.code}.pdf`,data:blob});
  }catch(e){if(e&&e.code==='dismissed'){toast('Đã hủy tải file');return}toast('Chưa tạo được PDF: '+(e.message||e.code),5000)}}

boot();
</script>
